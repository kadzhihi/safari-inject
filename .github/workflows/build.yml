name: Build IOSControl Safari HTTP

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: waruhachi/theos-action@v2.4.6
        with:
          libgcuniversal: 'false'
          altlist: 'false'

      - name: Validate project files exist
        shell: bash
        run: |
          set -euo pipefail
          required_files=(
            Makefile control Bootstrap.xm Payload.h Payload.m
            Diagnostics.h Diagnostics.m HTTPServer.h HTTPServer.m
            SafariPageFinder.h SafariPageFinder.m
            JavaScriptEvaluator.h JavaScriptEvaluator.m
            IOSControlSafariBootstrap.plist IOSControlSafariPayload.plist
            ioscontrol_safari_test.lua .github/workflows/build.yml
          )
          for file in "${required_files[@]}"; do
            [ -f "$file" ] || { echo "::error::Required file missing: $file"; exit 1; }
          done

      - name: Ensure packaging tools (dpkg)
        shell: bash
        run: |
          command -v dpkg-deb >/dev/null || brew install dpkg

      - name: Build Dopamine rootless package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf packages
          make clean
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

      - name: Inspect Theos build outputs
        shell: bash
        run: |
          echo "=== THEOS BUILT DYLIBS ==="
          find .theos -type f -name '*.dylib' -print -exec lipo -archs {} \; || true

      - name: Verify two-dylib package and architectures
        shell: bash
        run: |
          set -euo pipefail

          deb="$(find packages -maxdepth 1 -type f -name '*.deb' -print -quit)"
          if [ -z "${deb:-}" ]; then
            echo "::error::No Debian package found"
            exit 1
          fi

          echo "Found Debian package: $deb"
          echo "=== VERIFY CONTROL FIELDS ==="

          package="$(dpkg-deb -f "$deb" Package)"
          version="$(dpkg-deb -f "$deb" Version)"
          arch="$(dpkg-deb -f "$deb" Architecture)"
          depends="$(dpkg-deb -f "$deb" Depends || true)"

          echo "Package:      $package"
          echo "Version:      $version"
          echo "Architecture: $arch"
          echo "Depends:      $depends"

          [ "$package" = "com.ioscontrol.safarihttp" ] || {
            echo "::error::Unexpected Package field: $package"
            exit 1
          }
          [ "$arch" = "iphoneos-arm64" ] || {
            echo "::error::Unexpected Architecture: $arch"
            exit 1
          }
          [ -n "$version" ] || {
            echo "::error::Version is empty"
            exit 1
          }
          echo "$depends" | grep -qi 'ellekit' || {
            echo "::error::Depends does not include ellekit"
            exit 1
          }

          echo "=== PACKAGE CONTENTS ==="
          dpkg-deb -c "$deb"

          stage="$(mktemp -d)"
          trap 'rm -rf "$stage"' EXIT
          dpkg-deb -x "$deb" "$stage"

          echo "=== EXTRACTED FILES ==="
          find "$stage" -type f -print | sort

          expected=(
            IOSControlSafariBootstrap.dylib
            IOSControlSafariBootstrap.plist
            IOSControlSafariPayload.dylib
            IOSControlSafariPayload.plist
          )
          for name in "${expected[@]}"; do
            file="$(find "$stage" -type f -name "$name" -print -quit)"
            if [ -z "$file" ]; then
              echo "::error::$name not found inside .deb"
              echo "=== DEBUG PACKAGE CONTENTS ==="
              dpkg-deb -c "$deb"
              echo "=== DEBUG EXTRACTED FILES ==="
              find "$stage" -type f -print | sort
              exit 1
            fi
            echo "[OK] $name -> $file"
          done

          echo "=== VERIFY DYLIB ARCHITECTURES ==="
          for name in IOSControlSafariBootstrap IOSControlSafariPayload; do
            dylib="$(find "$stage" -type f -name "${name}.dylib" -print -quit)"
            if [ -z "$dylib" ]; then
              echo "::error::${name}.dylib missing"
              exit 1
            fi

            echo "--- $name ---"
            lipo -info "$dylib"
            archs="$(lipo -archs "$dylib")"
            echo "architectures=$archs"
            echo "$archs" | tr ' ' '\n' | grep -qx arm64 || {
              echo "::error::${name}.dylib missing arm64"
              exit 1
            }
            echo "$archs" | tr ' ' '\n' | grep -qx arm64e || {
              echo "::error::${name}.dylib missing arm64e"
              exit 1
            }
            echo "[OK] $name contains arm64 + arm64e"
          done

          echo "=== SUCCESS ==="
          echo "Package structure verified."
          echo "Bootstrap: arm64 + arm64e"
          echo "Payload:   arm64 + arm64e"

      - name: Upload Debian package artifact
        uses: actions/upload-artifact@v4
        with:
          name: IOSControlSafariBootstrapPayload-rootless-deb
          path: packages/*.deb
          if-no-files-found: error
